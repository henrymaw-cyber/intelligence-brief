name: Daily Intelligence Brief

on:
  schedule:
    # Morning window (Thailand 9:30 AM)
    - cron: '25 2 * * *'
    - cron: '30 2 * * *'
    - cron: '35 2 * * *'

    # Evening window (Thailand 5:30 PM)
    - cron: '25 10 * * *'
    - cron: '30 10 * * *'
    - cron: '35 10 * * *'

  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python intelligence_brief.py